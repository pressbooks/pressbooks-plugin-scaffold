name: Update .pot file 🌐

on:
  push:
    branches: [dev]
    paths:
      - "**/*.php"
      - "**/*.js"
  workflow_dispatch:


jobs:
  update-pot-file:
    uses: pressbooks/reusable-workflows/.github/workflows/update-pot.yml@main
    secrets: inherit
    with:
      domain: "<domain>"
      slug: "<domain>"
      package_name: "<domain-package>"
      headers: '{"Report-Msgid-Bugs-To": "https://github.com/pressbooks/<domain>/issues"}'
